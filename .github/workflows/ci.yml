name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: types
        run: pnpm typecheck
      - name: tests
        run: pnpm test
      - name: observations
        run: |
          pnpm observations:validate
          pnpm observations:check-privacy
          pnpm observations:aggregate
      - name: build
        run: pnpm build
